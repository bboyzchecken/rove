<!--
  ROVE wordmark (DEV_SPEC §15): R✳VE, where the O is an eight-petal asterisk —
  a compass rose and a flower at once. Eight directions = the trip that is not
  fixed in advance.

  Drawn as paths rather than a Unicode ✳ so it stays crisp at favicon size.
  Default variant: espresso body + terracotta asterisk, for light backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="ROVE">
  <g fill="#2C1A0E" font-family="Prompt, system-ui, sans-serif" font-weight="700" font-size="44" letter-spacing="1">
    <text x="0" y="42">R</text>
    <text x="86" y="42">VE</text>
  </g>
  <g transform="translate(59 26)" fill="#D4614A">
    <!-- Eight petals at 45° steps; each is a rounded lozenge from the centre. -->
    <g>
      <rect x="-3.2" y="-21" width="6.4" height="18" rx="3.2" />
      <rect x="-3.2" y="3" width="6.4" height="18" rx="3.2" />
      <rect x="-21" y="-3.2" width="18" height="6.4" rx="3.2" />
      <rect x="3" y="-3.2" width="18" height="6.4" rx="3.2" />
    </g>
    <g transform="rotate(45)">
      <rect x="-2.6" y="-19" width="5.2" height="16" rx="2.6" />
      <rect x="-2.6" y="3" width="5.2" height="16" rx="2.6" />
      <rect x="-19" y="-2.6" width="16" height="5.2" rx="2.6" />
      <rect x="3" y="-2.6" width="16" height="5.2" rx="2.6" />
    </g>
    <circle cx="0" cy="0" r="4.2" fill="#2C1A0E" />
  </g>
</svg>
