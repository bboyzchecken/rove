<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App icon: black compass on a white disc (ROVE_BRAND_SPEC v3 §2.1).
       Not a feature colour, and deliberately so: a favicon has no screen to
       belong to, so it takes the one neutral every screen shares. -->
  <circle cx="50" cy="50" r="50" fill="#FFFFFF"/>
  <g stroke="#000000" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M50 20V80"/>
    <path d="M20 50H80"/>
    <path d="M33.2 33.2 66.8 66.8"/>
    <path d="M66.8 33.2 33.2 66.8"/>
  </g>
</svg>
