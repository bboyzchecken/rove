name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: rove-cluster

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — no long-lived AWS keys, see deploy/terraform/iam.tf
    strategy:
      matrix:
        include:
          - app: api
            context: apps/api
            ecr_repo: rove-api
          - app: web
            context: apps/web
            ecr_repo: rove-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # Tagged by commit sha, not by the git tag: the deploy job below rebuilds
      # the same string from github.sha rather than passing it between jobs
      # (matrix job outputs collide — each leg overwrites the others).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ vars.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      # One at a time, api first: a web build that expects a new API endpoint
      # must never go live before that endpoint does.
      max-parallel: 1
      matrix:
        include:
          - app: api
            service: rove-api
            container: api
            ecr_repo: rove-api
          - app: web
            service: rove-web
            container: web
            ecr_repo: rove-web
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      # Pulls whatever task definition is LIVE right now — including every env
      # var and secret Terraform put there — and swaps only the image. This is
      # why CI never needs to know about env vars: deploy/terraform/ecs.tf is
      # the only place that defines them.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.service }} \
            --query taskDefinition \
            > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:sha-${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
