# rove — local development stack
#   docker compose up --build -d
# Everything (api, web, mysql, redis) reads the single root .env file.

name: rove

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${API_PORT:-5000}
    ports:
      - "${API_EXPOSED_PORT:-5050}:${API_PORT:-5000}"
    volumes:
      - ./apps/api:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-5000}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # The AI worker, off by default (Phase 3 — INFRA).
  #
  #   set ROVE_ROLE=api in .env, then
  #   docker compose --profile worker up -d
  #
  # Both steps matter: the profile starts this container, and ROVE_ROLE=api is
  # what makes the api container hand drafts over instead of running them
  # itself. Leave ROVE_ROLE=all and the worker sits on an empty queue while the
  # api keeps drafting — which is the right default for a laptop, and the
  # reason the split is opt-in.
  worker:
    profiles: ["worker"]
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      ROVE_ROLE: worker
    volumes:
      - ./apps/api:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_EXPOSED_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  go_mod_cache:
  go_build_cache:
  web_node_modules:
  web_next_cache:
